services:
  - type: web
    name: hospital-bulk-processor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Exactly one instance: batch state and per-batch locks live in process
    # memory, so a second instance would not see batches the first created.
    # (The free plan can't scale past one anyway; this states the intent.)
    numInstances: 1
    # SIGTERM -> SIGKILL window. Shutdown uses at most ~25s of it: 20s for
    # open requests (uvicorn) + SHUTDOWN_GRACE_SECONDS (5) for running batches.
    maxShutdownDelaySeconds: 30
    envVars:
      # PORT is injected by Render (default 10000); the Dockerfile binds to it.
      - key: WEB_CONCURRENCY  # belt and braces; the start command also pins --workers 1
        value: "1"
      - key: DIRECTORY_API_URL
        value: https://hospital-directory.onrender.com
      - key: DIRECTORY_MAX_CONCURRENCY
        value: "10"
      - key: SHUTDOWN_GRACE_SECONDS
        value: "5"
      - key: LOG_LEVEL
        value: INFO
