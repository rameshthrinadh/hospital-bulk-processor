services:
  - type: web
    name: hospital-bulk-processor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Exactly one instance: batch state and per-batch locks live in process
    # memory, so a second instance would not see batches the first created.
    # (The free plan can't scale past one anyway; this states the intent.)
    numInstances: 1
    # SIGTERM -> SIGKILL window. Shutdown uses at most ~25s of it: 20s for
    # open requests (uvicorn) + SHUTDOWN_GRACE_SECONDS (5) for running batches.
    maxShutdownDelaySeconds: 30
    envVars:
      # PORT is injected by Render (default 10000); the Dockerfile binds to it.
      - key: WEB_CONCURRENCY  # belt and braces; the start command also pins --workers 1
        value: "1"
      - key: DIRECTORY_API_URL
        value: https://hospital-directory.onrender.com
      - key: DIRECTORY_MAX_CONCURRENCY
        value: "10"
      - key: SHUTDOWN_GRACE_SECONDS
        value: "5"
      - key: LOG_LEVEL
        value: INFO
      # Browser origin of the web UI below. Render gives each service
      # https://<name>.onrender.com, adding a suffix if the name is taken:
      # if so, update this (and VITE_API_URL below) to the real URLs.
      - key: CORS_ORIGINS
        value: https://hospital-bulk-ui.onrender.com

  # The web UI: a static site built from frontend/. It calls the API directly
  # from the browser, so the API's public URL is baked in at build time.
  - type: web
    name: hospital-bulk-ui
    runtime: static
    rootDir: frontend
    # --include=dev: the build needs TypeScript and Vite even if NODE_ENV is
    # set to production.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    # Client-side routes (/history, /batches/<id>) all load index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Built assets have content hashes in their names.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://hospital-bulk-processor.onrender.com
